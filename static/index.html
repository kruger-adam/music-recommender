<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Recommender</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="player">
    <div class="art-wrap">
      <div class="art-placeholder" id="art-placeholder">🎵</div>
      <img id="album-art" class="hidden" alt="Album art">
    </div>

    <div class="song-title" id="song-title">Ready to play</div>
    <div class="song-artist" id="song-artist">Hit Start to begin</div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-start" id="btn-start">Start</button>
      <button class="btn-prev"      id="btn-prev"      style="display:none">‹ Prev</button>
      <button class="btn-pause"     id="btn-pause"     style="display:none">Pause</button>
      <button class="btn-superlike" id="btn-superlike" style="display:none">♥</button>
      <button class="btn-skip"      id="btn-skip"      style="display:none">Skip ›</button>
    </div>

    <div class="skip-reason-panel" id="skip-reason-panel" style="display:none">
      <div class="skip-reason-label">Why'd you skip?</div>
      <div class="skip-reason-chips">
        <button class="chip" data-reason="wrong_genre">Wrong genre</button>
        <button class="chip" data-reason="not_artist">Not this artist</button>
        <button class="chip" data-reason="not_mood">Not the mood</button>
        <button class="chip" data-reason="overplayed">Overplayed</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="trend-wrap" id="trend-wrap" style="display:none">
      <div class="trend-label" id="trend-label"></div>
      <svg id="trend-svg"></svg>
      <div class="skip-detail" id="skip-detail" style="display:none">
        <svg id="skip-svg"></svg>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="yt-wrap"><div id="yt-player"></div></div>

  <script src="/static/app.js"></script>
</body>
</html>
