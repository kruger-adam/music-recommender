<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Recommender</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Shuffle">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-panel" id="login-panel" style="display:none">
    <div class="login-title">Music Recommender</div>
    <div id="email-section">
      <p class="login-subtitle">Enter your email to sign in</p>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
      <button class="btn-start" id="btn-send-link">Send login code</button>
    </div>
    <div id="code-section" style="display:none">
      <p class="login-subtitle">Enter the 6-digit code from your email</p>
      <input type="text" id="login-code" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <button class="btn-start" id="btn-verify-code">Verify code</button>
    </div>
    <div class="login-msg" id="login-msg"></div>
  </div>

  <div class="player" id="player-panel" style="display:none">
    <div class="search-wrap" id="search-wrap">
      <button class="btn-search-toggle" id="btn-search-toggle" title="Search for a song">🔍</button>
      <div class="search-panel" id="search-panel" style="display:none">
        <input type="text" id="search-input" placeholder="Search for a song or artist…" autocomplete="off">
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <div class="art-wrap">
      <div class="art-placeholder" id="art-placeholder">🎵</div>
      <img id="album-art" class="hidden" alt="Album art">
    </div>

    <div id="song-info">
      <div class="song-title" id="song-title">Ready to play</div>
      <div class="song-artist" id="song-artist">Hit Start to begin</div>
      <div class="song-reason" id="song-reason"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-start" id="btn-start">Start</button>
      <button class="btn-prev"      id="btn-prev"      style="display:none">‹ Prev</button>
      <button class="btn-pause"     id="btn-pause"     style="display:none">Pause</button>
      <button class="btn-superlike" id="btn-superlike" style="display:none">♥</button>
      <button class="btn-skip"      id="btn-skip"      style="display:none">Skip ›</button>
    </div>

    <div class="skip-reason-panel" id="skip-reason-panel" style="display:none">
      <div class="skip-reason-label">Why'd you skip?</div>
      <div class="skip-reason-chips">
        <button class="chip" data-reason="wrong_genre">Wrong genre</button>
        <button class="chip" data-reason="not_artist">Not this artist</button>
        <button class="chip" data-reason="not_mood">Not the mood</button>
        <button class="chip" data-reason="overplayed">Overplayed</button>
      </div>
      <div class="skip-reason-secondary" id="skip-reason-secondary" style="display:none">
        <div class="skip-reason-label" id="skip-reason-secondary-label"></div>
        <div class="skip-reason-chips" id="skip-reason-secondary-chips"></div>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="trend-wrap" id="trend-wrap" style="display:none">
      <div class="trend-label" id="trend-label"></div>
      <svg id="trend-svg"></svg>
      <div class="skip-detail" id="skip-detail" style="display:none">
        <svg id="skip-svg"></svg>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="yt-wrap"><div id="yt-player"></div></div>

  <script src="/static/app.js"></script>
</body>
</html>
